services:
  home-assistant:
    image: homeassistant/home-assistant
    container_name: home-assistant
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - default
      - proxy_net
      - hass
    ports:
      - "8123:8123"
    volumes:
      - ${DOCKER_DIR}/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "dockhand.url=[Home Assistant](https://hass.cactuscove.casa)"
  zwavejs:
    image: zwavejs/zwavejs2mqtt:latest
    container_name: zwavejs
    restart: unless-stopped
    tty: true
    stop_signal: SIGINT
    ports:
      - "8091:8091"
      - "4000:3000"
    volumes:
      - zwavejs:/usr/src/app/store
    devices:
      - "/dev/serial/by-id/usb-Nabu_Casa_ZWA-2_1CDBD4AD2AAC-if00:/dev/serial/by-id/usb-Nabu_Casa_ZWA-2_1CDBD4AD2AAC-if00"
    environment:
      - ZWAVEJS_EXTERNAL_CONFIG=/usr/src/app/store/.config-db
      - TZ=${TZ}
    labels:
      - "dockhand.url=[Z-Wave JS](http://10.0.0.56:8091)"
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto_config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    environment:
      - TZ=${TZ}

volumes:
  zwavejs:
  mosquitto_data:
  mosquitto_log:

networks:
  proxy_net:
    external: true
  hass:
    external: true
