services:
  apprise:
    image: caronc/apprise:v1.5.1
    container_name: apprise
    restart: unless-stopped
    networks:
      - apprise
    ports:
      - "8001:8000"
    volumes:
      - apprise_config:/config
      - apprise_plugin:/plugin
      - apprise_attach:/attach
    environment:
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: "1"
      APPRISE_ADMIN: "y"

  matrix-continuwuity:
    image: forgejo.ellis.link/continuwuation/continuwuity:latest
    container_name: matrix-continuwuity
    restart: unless-stopped
    networks:
      - proxy_net
    ports:
      - "8448:6167"
    volumes:
      - continuwuity:/var/lib/continuwuity
    environment:
      # The domain name of your homeserver
      CONTINUWUITY_SERVER_NAME: cactuscove.casa
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_PORT: 6167
      # ~20 MB limit
      CONTINUWUITY_MAX_REQUEST_SIZE: 20000000
      # Allow your first account to be created
      CONTINUWUITY_ALLOW_REGISTRATION: 'true'
      # Set a secure token for private registration
      CONTINUWUITY_REGISTRATION_TOKEN: ${CONTINUWUITY_REGISTRATION_TOKEN}
      CONTINUWUITY_ALLOW_FEDERATION: 'true'
      CONTINUWUITY_ALLOW_CHECK_FOR_UPDATES: 'true'
      CONTINUWUITY_TRUSTED_SERVERS: '["matrix.org"]'
      CONTINUWUITY_ADDRESS: 0.0.0.0

networks:
  proxy_net:
    external: true
  apprise:
    external: true

volumes:
  apprise_config:
  apprise_plugin:
  apprise_attach:
  continuwuity:
