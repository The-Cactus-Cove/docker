services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id
    restart: unless-stopped
    networks:
      - proxy_net
    volumes:
      - pocket-id_data:/app/data
    environment:
      - TZ=${TZ}
      - APP_URL=https://auth.cactuscove.casa
      - ENCRYPTION_KEY=${POCKET_ID_ENCRYPTION_KEY}
      - TRUST_PROXY=false
    # Optional healthcheck
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    labels:
      - "dockhand.url=[Pocket ID](https://auth.cactuscove.casa)"

volumes:
  pocket-id_data:

networks:
  proxy_net:
    external: true
